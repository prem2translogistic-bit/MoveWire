/* Drag-to-scroll carousel of featured stories */
function Carousel({stories,onOpen}){
  const ref=useRef(null),st=useRef(null);
  const d=e=>{st.current={x:e.clientX,l:ref.current.scrollLeft}};
  const m=e=>{if(st.current&&e.pointerType==="mouse")ref.current.scrollLeft=st.current.l-(e.clientX-st.current.x)};
  const u=()=>{st.current=null};
  return <section className="mb-10"><h2 className="text-2xl font-black mb-1">Featured</h2><p className="text-sm text-slate-500 mb-4">Swipe or drag sideways.</p>
    <div ref={ref} onPointerDown={d} onPointerMove={m} onPointerUp={u} onPointerLeave={u} className="noscroll flex gap-4 overflow-x-auto snap-x snap-mandatory cursor-grab select-none">
      {stories.slice(0,6).map((s,i)=><div key={s.id} onClick={()=>onOpen(s)} className={`snap-start shrink-0 w-72 h-44 rounded-3xl p-5 text-white flex flex-col justify-between bg-gradient-to-br ${tiles[i%tiles.length].g}`}>

}

      <section id="about" className="rounded-[28px] bg-white border border-slate-200 p-8 grid md:grid-cols-[auto_1fr] gap-6 items-center mb-10">
        {OWNER.photo?<img src={OWNER.photo} alt={OWNER.name} className="w-32 h-32 rounded-full object-cover"/>:<div className="w-32 h-32 rounded-full bg-[#0d4a42] text-[#c9f55d] grid place-items-center text-4xl font-black">{initials}</div>}
        <div><div className="text-xs font-bold uppercase tracking-[.2em] text-[#0d4a42]">About the owner</div><h2 className="text-3xl font-black mt-1">{OWNER.name}</h2><div className="text-slate-500 font-semibold">{OWNER.title} • {OWNER.city}</div>
          <p className="text-slate-600 mt-3 max-w-2xl">{OWNER.bio}</p>
          <div className="mt-4 flex flex-wrap gap-3 text-sm font-bold"><a className="bg-[#0d4a42] text-white px-4 py-2 rounded-full" href={`mailto:${OWNER.email}`}>Email me</a>
            {OWNER.phone&&<a className="border border-slate-300 px-4 py-2 rounded-full" href={`tel:${OWNER.phone}`}>{OWNER.phone}</a>}
            {OWNER.linkedin&&<a className="border border-slate-300 px-4 py-2 rounded-full" href={OWNER.linkedin} target="_blank" rel="noreferrer">LinkedIn</a>}</div></div></section>

      <section id="contact" className="rounded-[28px] bg-[#dfefe9] p-8 flex flex-col md:flex-row gap-5 items-center justify-between">
        <div><h2 className="text-2xl font-black flex items-center gap-2"><Icon n="mail"/>Get the weekly logistics digest</h2><p className="text-slate-600 text-sm mt-1">Enter your email and it opens a message to {OWNER.name}.</p></div>
        {subDone?<div className="font-bold text-[#0d4a42]">Thanks for subscribing!</div>:
        <div className="flex gap-2 w-full md:w-auto"><input value={sub} onChange={e=>setSub(e.target.value)} placeholder="you@company.com" className="flex-1 md:w-72 px-4 py-3 rounded-full border border-slate-200 outline-none focus:ring-2 focus:ring-emerald-700"/><button onClick={subscribe} className="bg-[#0d4a42] text-white font-black px-5 rounded-full">Subscribe</button></div>}</section>
    </main>

    <footer className="max-w-7xl mx-auto px-5 py-10 text-center text-xs text-slate-500">© {new Date().getFullYear()} MOVEWIRE • Owned and operated solely by {OWNER.name}. All rights reserved. News headlines link to their original publishers. <button onClick={()=>setLoginOpen(true)} className="ml-2 underline opacity-70 hover:opacity-100">Owner login</button></footer>

    {loginOpen&&<div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 grid place-items-center p-4"><div className="bg-white w-full max-w-sm rounded-[28px] p-6 shadow-2xl">
      <div className="flex justify-between items-center mb-4"><h2 className="text-xl font-black">Owner login</h2><button onClick={()=>{setLoginOpen(false);setLoginErr("")}} className="p-2 bg-slate-100 rounded-full"><Icon n="x"/></button></div>
      <input type="password" autoFocus value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&tryLogin()} placeholder="Owner passcode" className="w-full border rounded-xl p-3"/>
      {loginErr&&<div className="text-sm text-red-700 mt-2">{loginErr}</div>}
      <button onClick={tryLogin} className="w-full bg-[#0d4a42] text-white rounded-xl py-3 font-black mt-3">Log in</button></div></div>}

    {sel&&<div onClick={()=>setSel(null)} className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 grid place-items-center p-4"><div onClick={e=>e.stopPropagation()} className="bg-white w-full max-w-xl rounded-[28px] overflow-hidden shadow-2xl">
      <div className={`h-32 bg-gradient-to-br ${tiles.find(t=>t.icon===sel.icon)?.g||tiles[0].g} p-5 flex justify-between`}><span className="px-3 py-1 h-fit rounded-full bg-white/90 text-[#0d4a42] text-xs font-black">{sel.category}</span><button onClick={()=>setSel(null)} className="p-2 h-fit bg-white/80 rounded-full"><Icon n="x" size={18}/></button></div>
      <div className="p-6"><div className="text-xs text-slate-500 mb-2">{sel.date} • {sel.region} • {sel.source}</div><h2 className="text-2xl font-black leading-tight">{sel.title}</h2><p className="text-slate-600 mt-3 leading-7">{sel.summary}</p>
        <div className="mt-5 flex gap-3"><button onClick={()=>toggleSave(sel)} className="px-4 py-2 rounded-full border font-bold text-sm">{isSaved(sel)?"Saved ✓":"Save"}</button><button onClick={()=>share(sel)} className="px-4 py-2 rounded-full border font-bold text-sm">Share</button>
          {sel.url&&<a href={sel.url} target="_blank" rel="noreferrer" className="px-4 py-2 rounded-full bg-[#0d4a42] text-white font-bold text-sm">Read full story</a>}</div></div></div></div>}

    {open&&isOwner&&<div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 grid place-items-center p-4"><div className="bg-white w-full max-w-xl rounded-[28px] p-6 shadow-2xl">
      <div className="flex justify-between items-center mb-5"><div><h2 className="text-2xl font-black">Post a logistics story</h2><p className="text-sm text-slate-500">Visible on your device until you reload.</p></div><button onClick={()=>setOpen(false)} className="p-2 bg-slate-100 rounded-full"><Icon n="x"/></button></div>
      <div className="space-y-3">
        <input className="w-full border rounded-xl p-3" placeholder="Story title" value={draft.title} onChange={e=>setDraft({...draft,title:e.target.value})}/>
        <textarea className="w-full border rounded-xl p-3 min-h-28" placeholder="Short summary" value={draft.summary} onChange={e=>setDraft({...draft,summary:e.target.value})}/>
        <div className="grid grid-cols-2 gap-3"><select className="border rounded-xl p-3" value={draft.category} onChange={e=>setDraft({...draft,category:e.target.value})}>{cats.slice(1).map(c=><option key={c}>{c}</option>)}</select>
          <input className="border rounded-xl p-3" placeholder="Region" value={draft.region} onChange={e=>setDraft({...draft,region:e.target.value})}/></div>
        <input className="w-full border rounded-xl p-3" placeholder="Source name" value={draft.source} onChange={e=>setDraft({...draft,source:e.target.value})}/>
        <input className="w-full border rounded-xl p-3" placeholder="Article URL (optional)" value={draft.url} onChange={e=>setDraft({...draft,url:e.target.value})}/>
        <button onClick={post} className="w-full bg-[#0d4a42] text-white rounded-xl py-3 font-black">Publish story</button></div></div></div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
